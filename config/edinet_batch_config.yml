# =====================================================
# EDINET 日次バッチ設定
# =====================================================

# --- APIバジェット ---
# 1日あたりのAPIリクエスト上限（EDINET API 負荷配慮）
daily_budget: 100

# リクエスト間の待機秒数（API負荷軽減用）
request_interval_sec: 2.0

# --- Phase A: 日次スキャン ---
# documents.json を取得する直近日数
scan_days: 5

# --- Phase B: シード銘柄処理 ---
# XBRL ZIPをダウンロードするか
download_xbrl: true

# PDFをダウンロードするか（バジェット節約のため初期はOFF）
download_pdf: false

# 財務ハイライト抽出を実行するか
process_highlights: true

# 派生指標計算を実行するか
process_derived: true

# --- Phase C: バックフィル ---
# バックフィルで遡る最大日数
backfill_max_days: 365

# バックフィルの対象開始日（これ以前は対象外）
# EDINET API v2 は過去5年分のデータを提供
backfill_start_date: "2024-01-01"

# --- 優先取得する書類タイプ ---
priority_doc_types:
  - "120"   # 有価証券報告書
  - "140"   # 四半期報告書
  - "160"   # 半期報告書

# --- シード銘柄のEDINETコードマッピング ---
# stock_code -> edinet_code
# EdinetClient.fallback_map と同期させること
