{# templates/candle_patterns/partials/_tabs.html #}
<div class="flex flex-wrap gap-2 mb-10 bg-slate-100 dark:bg-slate-900/50 p-1.5 rounded-2xl w-fit mx-auto md:mx-0"
    role="tablist">
    {% for key, label in group_labels.items() %}
    {% set is_active = key == active_tab %}
    <button
        class="px-6 py-3 rounded-xl font-bold text-sm transition-all flex items-center gap-3 relative overflow-hidden"
        :class="activeTab === '{{ key }}' 
                ? 'bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-sm' 
                : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'" @click="activeTab = '{{ key }}'"
        hx-get="/candle-patterns?tab={{ key }}" hx-target="#listArea" hx-swap="innerHTML" hx-push-url="true"
        hx-indicator="#listLoading" role="tab" aria-selected="{{ 'true' if is_active else 'false' }}">
        <span>{{ label }}</span>
        <span
            class="px-2 py-0.5 rounded-lg text-[10px] bg-slate-100 dark:bg-slate-700 text-slate-400 group-active:scale-90 transition-transform">
            {{ group_counts[key] }}
        </span>
    </button>
    {% endfor %}
</div>
