<div class="pattern-tabs pattern-tabs--pill" role="tablist" aria-label="ローソク足パターンタブ">
    {% for key, label in group_labels.items() %}
    {% set is_active = key == active_tab %}
    <button class="tab-button pattern-tab {% if is_active %}is-active{% endif %}"
            type="button"
            role="tab"
            aria-selected="{{ 'true' if is_active else 'false' }}"
            aria-controls="listArea"
            tabindex="{{ '0' if is_active else '-1' }}"
            data-pattern-tab="{{ key }}"
            hx-get="/candle-patterns?tab={{ key }}"
            hx-target="#listArea"
            hx-swap="innerHTML"
            hx-push-url="true"
            hx-indicator="#listLoading">
        <span class="tab-label">{{ label }}</span>
        <span class="count-badge" data-count-target="{{ group_counts[key] }}">{{ group_counts[key] }}</span>
    </button>
    {% endfor %}
</div>
