{% extends "base.html" %}
{% block content %}
<div class="pattern-page">
    <section class="pattern-hero">
        <div class="pattern-hero__top">
            <div>
                <h1>ローソク足パターン</h1>
                <p class="hero-desc">トレンドの転換や継続を示すパターンをカードとモーダルで直感的に把握できます。</p>
            </div>
        </div>
    </section>
    {% include "candle_patterns/partials/_tabs.html" %}

    <div id="listLoading" class="list-loading htmx-indicator" aria-live="polite">読み込み中...</div>
    <div id="listArea">
        {% include "candle_patterns/partials/_list_area.html" %}
    </div>

    <div class="pattern-modal-overlay" data-modal-overlay hidden>
        <div class="pattern-modal" role="dialog" aria-modal="true" aria-label="ローソク足パターン詳細">
            <button class="modal-close" type="button" data-close-modal aria-label="閉じる">×</button>
            <div class="modal-body">
                <div class="modal-visual">
                    <img data-modal-image alt="" />
                </div>
                <div class="modal-text">
                    <h2 data-modal-name></h2>
                    <p class="modal-catch" data-modal-catch></p>
                    <div class="modal-sec">
                        <h3>特徴</h3>
                        <p class="modal-desc">
                            <strong data-modal-desc-lead></strong>
                            <span class="modal-desc-body" data-modal-desc-body></span>
                        </p>
                    </div>
                    <div class="modal-sec">
                        <h3>詳細</h3>
                        <p class="modal-detail" data-modal-detail></p>
                    </div>
                    <div class="modal-meta-grid">
                        <div class="modal-sec">
                            <h3>出やすい場面</h3>
                            <p class="modal-meta" data-modal-scene></p>
                        </div>
                        <div class="modal-sec">
                            <h3>図の見方</h3>
                            <p class="modal-meta" data-modal-howto></p>
                        </div>
                    </div>
                    <div class="modal-sec">
                        <h3>注意点</h3>
                        <ul class="note-list" data-modal-notes></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
