{% extends "base.html" %}
{% block content %}
<section class="cal-page">
    <!-- 注意文（安全装置） -->
    <div class="cal-notice">
        ⓘ 表示は取得できた日程のみ。未取得の項目は「情報不足」として表示します。
    </div>

    <!-- 上部フィルタ -->
    <div class="cal-filters">
        <form id="cal-filter-form" class="cal-filter-row">
            <!-- ウォッチのみ -->
            <label class="cal-filter-check">
                <input type="checkbox" name="watch_only" value="on" {% if filters.watch_only %}checked{% endif %}
                    onchange="updateCalendar()">
                ウォッチのみ
            </label>

            <!-- 銘柄コード -->
            <label class="cal-filter-label">
                銘柄:
                <input type="text" name="code" value="{{ filters.code }}" placeholder="銘柄コード" class="cal-filter-input"
                    onchange="updateCalendar()">
            </label>

            <!-- 種別 -->
            <label class="cal-filter-check">
                <input type="checkbox" name="type_earnings" value="EARNINGS" {% if filters.types_earnings %}checked{%
                    endif %} onchange="updateCalendar()">
                決算
            </label>
            <label class="cal-filter-check">
                <input type="checkbox" name="type_dividend" value="DIVIDEND" {% if filters.types_dividend %}checked{%
                    endif %} onchange="updateCalendar()">
                配当
            </label>

            <!-- 更新ボタン -->
            <button type="button" class="cal-refresh-btn" hx-post="/actions/events/refresh" hx-target="#cal-body"
                hx-swap="innerHTML" hx-include="#cal-filter-form" hx-vals='{"month": "{{ cal.month_str }}"}'
                hx-indicator="#cal-loading">
                🔄 更新
            </button>
        </form>
    </div>

    <!-- ローディング -->
    <div id="cal-loading" class="htmx-indicator">
        <div class="spinner"></div>
    </div>

    <!-- カレンダー本体 -->
    <div id="cal-body">
        {% include "calendar/partials/_calendar_body.html" %}
    </div>
</section>

<script>
    // カレンダーUI用の軽量JS
    function updateCalendar() {
        const form = document.getElementById('cal-filter-form');
        const params = buildFilterParams();
        const monthStr = document.querySelector('[data-cal-month]')?.dataset.calMonth || '';

        // 月グリッドを更新
        htmx.ajax('GET', '/partials/calendar/month_grid?' + params + '&month=' + monthStr, {
            target: '#cal-grid-container',
            swap: 'innerHTML'
        });

        // 日リストを更新
        const selectedDate = document.querySelector('.cal-cell.is-selected')?.dataset.date || '';
        htmx.ajax('GET', '/partials/calendar/day?' + params + '&date=' + selectedDate, {
            target: '#cal-day-container',
            swap: 'innerHTML'
        });
    }

    function buildFilterParams() {
        const form = document.getElementById('cal-filter-form');
        const params = new URLSearchParams();

        // ウォッチのみ
        const watchOnly = form.querySelector('[name="watch_only"]');
        if (watchOnly && watchOnly.checked) {
            params.set('watch_only', 'on');
        } else {
            params.set('watch_only', 'off');
        }

        // 銘柄コード
        const code = form.querySelector('[name="code"]')?.value?.trim();
        if (code) params.set('code', code);

        // 種別
        const types = [];
        if (form.querySelector('[name="type_earnings"]')?.checked) types.push('EARNINGS');
        if (form.querySelector('[name="type_dividend"]')?.checked) types.push('DIVIDEND');
        if (types.length > 0 && types.length < 2) {
            params.set('types', types.join(','));
        }

        return params.toString();
    }

    function selectDate(dateStr) {
        // 選択状態の更新
        document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('is-selected'));
        const target = document.querySelector(`.cal-cell[data-date="${dateStr}"]`);
        if (target) target.classList.add('is-selected');

        // 右側リストを更新
        const params = buildFilterParams();
        htmx.ajax('GET', '/partials/calendar/day?' + params + '&date=' + dateStr, {
            target: '#cal-day-container',
            swap: 'innerHTML'
        });

        // URL更新
        const url = new URL(window.location);
        url.searchParams.set('date', dateStr);
        history.pushState({}, '', url);
    }

    function switchMonth(monthStr) {
        const params = buildFilterParams();

        // URL更新
        const url = new URL(window.location);
        url.searchParams.set('month', monthStr);
        url.searchParams.delete('date');
        history.pushState({}, '', url);

        // 月グリッドを更新
        htmx.ajax('GET', '/partials/calendar/month_grid?' + params + '&month=' + monthStr, {
            target: '#cal-grid-container',
            swap: 'innerHTML'
        });

        // 日リストをリセット（当該月の1日）
        const parts = monthStr.split('-');
        const today = new Date();
        let resetDate;
        if (today.getFullYear() === parseInt(parts[0]) && (today.getMonth() + 1) === parseInt(parts[1])) {
            // 当月なら今日
            resetDate = today.toISOString().split('T')[0];
        } else {
            resetDate = monthStr + '-01';
        }

        htmx.ajax('GET', '/partials/calendar/day?' + params + '&date=' + resetDate, {
            target: '#cal-day-container',
            swap: 'innerHTML'
        });
    }
</script>
{% endblock %}
