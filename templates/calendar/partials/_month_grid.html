{# templates/calendar/partials/_month_grid.html #}
<div
    class="bg-white dark:bg-[#16161e] border border-slate-200 dark:border-slate-800 rounded-2xl shadow-soft overflow-hidden">
    <!-- Month Nav -->
    <div class="flex items-center justify-between px-6 py-6 border-b border-slate-100 dark:border-slate-800">
        <button type="button"
            class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 hover:text-blue-600 transition-all shadow-sm border border-slate-200 dark:border-slate-800"
            @click="$dispatch('calendar-switch-month', '{{ cal.prev_month }}')">
            <span class="text-xl">◀</span>
        </button>
        <h2 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">{{ cal.month_label }}</h2>
        <button type="button"
            class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 hover:text-blue-600 transition-all shadow-sm border border-slate-200 dark:border-slate-800"
            @click="$dispatch('calendar-switch-month', '{{ cal.next_month }}')">
            <span class="text-xl">▶</span>
        </button>
    </div>

    <!-- Weekdays Header -->
    <div class="grid grid-cols-7 bg-slate-50 dark:bg-slate-900/50">
        {% for wd in cal.weekdays %}
        <div class="py-3 text-center text-[10px] font-black uppercase tracking-widest text-slate-400 border-b border-slate-100 dark:border-slate-800
                    {% if loop.index == 6 %}text-blue-500/70 {% elif loop.index == 7 %}text-rose-500/70{% endif %}">
            {{ wd }}
        </div>
        {% endfor %}
    </div>

    <!-- Days Grid -->
    <div
        class="grid grid-cols-7 divide-x divide-y divide-slate-100 dark:divide-slate-800 border-b border-slate-100 dark:border-slate-800">
        {% for cell in cal.cells %}
        {% if cell.is_empty %}
        <div class="aspect-square bg-slate-50/30 dark:bg-slate-900/10"></div>
        {% else %}
        <button type="button"
            class="aspect-square p-2 relative flex flex-col items-start gap-1 transition-all group overflow-hidden"
            :class="selectedDate === '{{ cell.date_str }}' 
                            ? 'bg-blue-50 dark:bg-blue-900/20 ring-2 ring-inset ring-blue-500 z-10' 
                            : 'hover:bg-slate-50 dark:hover:bg-slate-800/50'"
            @click="$dispatch('calendar-select-date', '{{ cell.date_str }}')">

            <span class="text-sm font-bold transition-transform group-hover:scale-110"
                class="{% if cell.is_today %}text-blue-600 dark:text-blue-400 bg-blue-100 dark:bg-blue-900/40 rounded-full px-1.5 -ml-1.5{% else %}text-slate-900 dark:text-slate-400{% endif %}">
                {{ cell.day }}
            </span>

            {% if cell.has_events %}
            <div class="mt-auto w-full flex flex-col gap-0.5">
                {% for tag in cell.tags[:2] %}
                <div
                    class="text-[8px] font-black px-1.5 py-0.5 rounded-sm uppercase tracking-tighter truncate
                                    {% if tag == '決算' %}bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400
                                    {% else %}bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-400{% endif %}">
                    {{ tag }}
                </div>
                {% endfor %}
                {% if cell.extra_count > 0 %}
                <div class="text-[8px] font-black text-slate-400">+{{ cell.extra_count }}</div>
                {% endif %}
            </div>
            {% endif %}
        </button>
        {% endif %}
        {% endfor %}
    </div>
</div>
