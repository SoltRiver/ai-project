{% extends "base.html" %}

{% block content %}
<section class="page-header" style="margin-bottom: 2rem;">
    <div>
        <h1>銘柄騰落ランキング</h1>
        <p class="description" style="margin-top: 0.5rem; color: var(--muted); margin-bottom: 0.25rem;">
            主要銘柄の中から、指定期間で最も上昇・下落した銘柄をAIが分析します。</p>
        <div class="disclaimer-box">
            <p class="disclaimer-text-large">
                本画面の情報は投資勧誘を目的としたものではなく、投資の最終判断はご自身で行ってください。
            </p>
        </div>
    </div>
</section>

<!-- コントロールセクション -->
<div class="ranking-controls card">
    <div class="control-group">
        <label for="rank-type-tabs">表示タイプ:</label>
        <div id="rank-type-tabs" class="tab-buttons">
            <button class="tab-btn active" hx-get="/ranking/list?type=top&period={{ period }}"
                hx-target="#ranking-display" onclick="updateTabActive(this, 'type')">株価上昇率</button>
            <button class="tab-btn" hx-get="/ranking/list?type=bottom&period={{ period }}" hx-target="#ranking-display"
                onclick="updateTabActive(this, 'type')">株価下落率</button>
        </div>
    </div>

    <div class="control-group">
        <label for="period-select">期間:</label>
        <select id="period-select" name="period" class="modern-select" hx-get="/ranking/list"
            hx-target="#ranking-display" hx-include="[name='rank-type-input']" hx-trigger="change">
            <option value="today" selected>今日</option>
            <option value="week">週間</option>
            <option value="month">月間</option>
            <option value="year">年間</option>
        </select>
        <!-- HTMX用隠し入力 -->
        <input type="hidden" name="rank-type-input" id="rank-type-input" value="top">
    </div>
</div>

<!-- メイン表示エリア (HTMXで書き換え) -->
<div id="ranking-display" class="ranking-content">
    {% include "ranking/_list.html" %}
</div>

<div class="disclaimer text-muted mt-4">
    <p>※数値は営業日ベースで算出されています。最新価格は市場状況により遅延する場合があります。</p>
</div>
</div>

<script>
    function updateTabActive(btn, category) {
        // タブの見た目を更新
        const buttons = btn.parentElement.querySelectorAll('.tab-btn');
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // 隠し入力の値を更新
        if (category === 'type') {
            const isTop = btn.innerText.includes('上昇');
            const input = document.getElementById('rank-type-input');
            input.value = isTop ? 'top' : 'bottom';

            // selectのHTMXリクエスト用に周期を同期するため、selectの現在の値をリクエストに含める
            // (注: HTMXの hx-get 内のクエリパラメータは固定なので、動的な切り替えには
            //  hx-vals や要素の include が必要ですが、ここでは単純化のため onclick で調整)
            const period = document.getElementById('period-select').value;
            btn.setAttribute('hx-get', `/ranking/list?type=${input.value}&period=${period}`);
        }
    }
</script>
{% endblock %}
