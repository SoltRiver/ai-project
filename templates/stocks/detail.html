{% extends "base.html" %}
{% block content %}
<section class="page-header detail-header">
    <div>
        <h1 class="stock-title">{{ stock.display_name }}</h1>
        <div class="price-stack detail-price">
            <div class="main-price">{{ stock.price_text }}</div>
            <div class="muted change-line">
                <span class="change-badge change-{{ stock.change_direction }}">
                    <span
                        class="{{ 'arrow-up' if stock.change_direction == 'up' else 'arrow-down' if stock.change_direction == 'down' else '' }}">{{
                        stock.change_icon }}</span>
                    {{ stock.change_text }}
                </span>
            </div>
            <!-- Link removed: Fundamental analysis is now embedded in the tab -->
        </div>
    </div>
</section>

<div class="tab-bar" role="tablist" aria-label="タブ切り替え">
    {% for tab in tabs %}
    <button class="tab-button {% if loop.first %}is-active{% endif %}" type="button" data-tab-name="{{ tab.name }}"
        aria-pressed="{{ 'true' if loop.first else 'false' }}" hx-get="/stocks/{{ stock.code }}/tab/{{ tab.name }}"
        hx-target="#tab-content" hx-swap="innerHTML" hx-indicator="#tab-loading">
        <span class="tab-icon">{{ tab.icon }}</span>
        <span>{{ tab.label }}</span>
    </button>
    {% endfor %}
</div>

<div class="tab-content-wrapper">
    <div id="tab-loading" class="htmx-indicator">
        <div class="spinner"></div>
    </div>
    <div id="tab-content" hx-get="/stocks/{{ stock.code }}/tab/chart" hx-trigger="load" hx-target="#tab-content"
        hx-swap="innerHTML" hx-indicator="#tab-loading">
    </div>
</div>
{% endblock %}
