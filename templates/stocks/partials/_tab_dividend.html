<div class="tab-panel">

    {% if dividends %}
    <div class="mini-table">
        <div class="mini-row mini-head"><span>支払日</span><span>配当額</span></div>
        {% for row in dividends %}
        <div class="mini-row"><span>{{ row.date }}</span><span>{{ row.amount }}</span></div>
        {% endfor %}
    </div>
    {% else %}
    <p class="muted">配当履歴がありません。</p>
    {% endif %}

    <div class="card">
        <div class="section-title">配当利回り / 配当方針</div>
        <div class="mini-table">
            <div class="mini-row"><span>現在の利回り</span><span>{{ yield_info.yield }}</span></div>
            <div class="mini-row"><span>配当方針</span><span>{{ yield_info.policy }}</span></div>
        </div>
    </div>
</div>
