{% extends "base.html" %}

{% block content %}
<style>
    /* Glossary Page Styles */
    .glossary-hero {
        text-align: center;
        margin-bottom: 3rem;
        padding: 2rem 0;
    }

    .glossary-hero h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .glossary-hero p {
        color: var(--text-muted);
        font-size: 1.1rem;
        max-width: 600px;
        margin: 0 auto;
    }

    .term-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 2rem;
        padding-bottom: 4rem;
    }

    .term-card {
        background: var(--bg-card);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border-color);
    }

    .term-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .term-image-container {
        width: 100%;
        height: 180px;
        background: radial-gradient(circle at center, #f3f4f6, #e5e7eb);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .term-image {
        width: 120px;
        height: 120px;
        object-fit: contain;
        transition: transform 0.3s ease;
    }

    .term-card:hover .term-image {
        transform: scale(1.1);
    }

    .term-content {
        padding: 1.5rem;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }

    .term-category {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--primary-color);
        font-weight: 600;
        margin-bottom: 0.5rem;
    }

    .term-title {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        color: var(--text-main);
    }

    .term-meaning {
        font-size: 0.95rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 1.5rem;
        flex-grow: 1;
    }

    .term-tip-box {
        background: rgba(37, 99, 235, 0.05);
        border-radius: 12px;
        padding: 1rem;
        border-left: 4px solid var(--primary-color);
    }

    .term-tip-label {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--primary-color);
        margin-bottom: 0.25rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .term-tip-text {
        font-size: 0.9rem;
        color: var(--text-main);
        line-height: 1.5;
    }

    /* Dark mode adjustments explicitly if not handled by base vars */
    @media (prefers-color-scheme: dark) {
        .term-image-container {
            background: radial-gradient(circle at center, #374151, #1f2937);
        }

        .term-tip-box {
            background: rgba(59, 130, 246, 0.1);
        }
    }
</style>

<div class="glossary-hero">
    <h1>株式投資用語集</h1>
    <p>投資を始めるための重要な用語を、直感的なビジュアルとわかりやすい解説で学びましょう。</p>
</div>

<div class="card" style="background: transparent; border: none; box-shadow: none;">
    <div class="term-grid">
        {% for term in terms %}
        <article class="term-card">
            <div class="term-image-container">
                <img src="/static/images/glossary/{{ term.id }}.png" alt="{{ term.term }}" class="term-image"
                    loading="lazy">
            </div>
            <div class="term-content">
                <div class="term-category">{{ term.category }}</div>
                <h2 class="term-title">{{ term.term }}</h2>
                <p class="term-meaning">{{ term.meaning }}</p>
                {% if term.tip %}
                <div class="term-tip-box">
                    <div class="term-tip-label">💡 Point</div>
                    <p class="term-tip-text">{{ term.tip }}</p>
                </div>
                {% endif %}
            </div>
        </article>
        {% endfor %}
    </div>
</div>
{% endblock %}
