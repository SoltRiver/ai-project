{# templates/partials/_candle_modal.html #}
<div x-data="{ 
    open: false, 
    pattern: {},
    init() {
        window.showPatternCardModal = (patternId) => {
            const chartWrappers = document.querySelectorAll('.chart-wrapper');
            let found = null;
            for (const wrap of chartWrappers) {
                const script = wrap.querySelector('#chart-payload-json');
                if (script) {
                    try {
                        const payload = JSON.parse(script.textContent);
                        if (payload.candle_patterns) {
                            found = payload.candle_patterns.find(p => p.id === patternId);
                        }
                    } catch (e) { }
                }
                if (found) break;
            }
            if (found) {
                this.pattern = found;
                this.open = true;
            }
        }
    }
}" @keydown.window.escape="open = false" @open-pattern-modal.window="pattern = $event.detail; open = true">
    <template x-teleport="body">
        <div x-show="open"
            class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
            x-transition.opacity>

            <div x-show="open" x-transition.scale.95 @click.outside="open = false"
                class="bg-white dark:bg-[#16161e] border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto relative p-6 md:p-8">

                <button @click="open = false"
                    class="absolute top-4 right-4 text-2xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">&times;</button>

                <div class="flex flex-col md:flex-row gap-8 items-start">
                    <!-- Left: Visual -->
                    <div
                        class="w-full md:w-1/3 flex justify-center bg-slate-50 dark:bg-slate-900/50 rounded-xl p-4 border border-slate-100 dark:border-slate-800">
                        <img :src="pattern.image || (pattern.type === '陽線' ? '/static/images/big_bull.svg' : '/static/images/big_bear.svg')"
                            :alt="pattern.name" class="max-w-[120px] h-auto drop-shadow-lg">
                    </div>

                    <!-- Right: Content -->
                    <div class="w-full md:w-2/3">
                        <h2 x-text="pattern.name" class="text-3xl font-extrabold text-slate-900 dark:text-white mb-6">
                        </h2>

                        <div class="space-y-6">
                            <section>
                                <h3
                                    class="text-sm font-bold uppercase tracking-wider text-blue-600 dark:text-blue-400 mb-2">
                                    特徴</h3>
                                <p class="text-slate-700 dark:text-slate-300">
                                    <strong x-text="pattern.desc_lead" class="block mb-1 text-lg"></strong>
                                    <span x-text="pattern.desc_body" class="leading-relaxed"></span>
                                </p>
                            </section>

                            <section>
                                <h3
                                    class="text-sm font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 mb-2">
                                    推奨アクション</h3>
                                <div class="bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-800 rounded-xl p-4 text-emerald-800 dark:text-emerald-200"
                                    x-text="pattern.action"></div>
                            </section>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <section>
                                    <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2">出現しやすい場面
                                    </h3>
                                    <p class="text-sm text-slate-600 dark:text-slate-400" x-text="pattern.scene || 'ー'">
                                    </p>
                                </section>
                                <section>
                                    <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2">攻略のポイント
                                    </h3>
                                    <p class="text-sm text-slate-600 dark:text-slate-400" x-text="pattern.howto || 'ー'">
                                    </p>
                                </section>
                            </div>

                            <section x-show="pattern.tips && pattern.tips.length > 0">
                                <h3
                                    class="text-sm font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400 mb-2">
                                    実践アドバイス</h3>
                                <ul class="list-disc list-inside text-sm text-slate-600 dark:text-slate-400 space-y-1">
                                    <template x-for="tip in (pattern.tips || [])" :key="tip">
                                        <li x-text="tip"></li>
                                    </template>
                                </ul>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>
